[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contractex"
version = "0.4.0"
description = "Modern Python library for LLM-powered contract intelligence and legal document analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Contract-Clause-Extractor Team", email = "contact@example.com"}
]
keywords = ["legal-tech", "contract-analysis", "nlp", "llm", "document-intelligence", "cuad"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
]

# Only what every install needs.  LLM vendor SDKs are optional extras: the
# library never talks to a provider the caller did not install and name.
dependencies = [
    "pydantic>=2.9.0",
    "pypdfium2>=4.30",
    "python-docx>=1.1.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
# LLM providers (install the one you use)
openai = ["openai>=1.50.0"]
anthropic = ["anthropic>=0.39.0"]
google = ["google-genai>=1.0.0"]
ollama = ["ollama>=0.1.0"]
langchain = ["langchain>=0.3.0", "langchain-community>=0.3.0"]
# Presidio PII detection and ENCRYPT redaction
privacy = ["presidio-analyzer>=2.2.0", "cryptography>=41.0.0"]
# Document and data handling
ocr = ["pytesseract>=0.3.10", "pillow>=10.0.0"]
network = ["requests>=2.31.0"]
export = ["pandas>=2.2.0", "openpyxl>=3.1.0"]
spacy = ["spacy>=3.7.0"]
# Storage and retrieval
storage = ["psycopg2-binary>=2.9.9", "pgvector>=0.3.0"]
rag = ["sentence-transformers>=2.0.0"]
graph = ["networkx>=3.0.0", "neo4j>=5.0.0", "rdflib>=7.0.0"]
all = [
    "contractex[openai,anthropic,google,ollama,langchain,privacy,ocr,network,export,spacy,storage,rag,graph]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "black==24.10.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.0",
    # exercised by the test suite
    "cryptography>=41.0.0",
    "pillow>=10.0.0",
    "psycopg2-binary>=2.9.9",
    "requests>=2.31.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24",
    "mkdocs-autorefs>=0.5",
    "mkdocs-minify-plugin>=0.7",
]

[project.urls]
Homepage = "https://github.com/aahepburn/Contract-Clause-Extractor"
Documentation = "https://github.com/aahepburn/Contract-Clause-Extractor/blob/main/README.md"
Repository = "https://github.com/aahepburn/Contract-Clause-Extractor"
Issues = "https://github.com/aahepburn/Contract-Clause-Extractor/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["contractex*"]
exclude = ["tests*", "examples*", "benchmarks*", "docs*"]

[tool.setuptools.package-data]
contractex = ["storage/*.sql", "storage/migrations/*.sql", "playbooks/*.yaml"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "UP042", # StrEnum changes str(member); not a lint-only change
]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E402"]  # Allow imports not at top for demonstration purposes

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: tests with no external dependencies",
    "integration: tests that need PostgreSQL",
    "smoke: quick smoke tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "error::UserWarning",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["contractex"]
omit = [
    "tests/*",
    "examples/*",
    "benchmarks/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
