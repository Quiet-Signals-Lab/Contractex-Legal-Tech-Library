[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contractex"
version = "0.3.1"
description = "Modern Python library for LLM-powered contract intelligence and legal document analysis"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Contract-Clause-Extractor Team", email = "contact@example.com"}
]
keywords = ["legal-tech", "contract-analysis", "nlp", "llm", "document-intelligence", "cuad"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "pydantic>=2.9.0",
    "eval_type_backport>=0.2.0; python_version < '3.10'",
    "openai>=1.50.0",
    "anthropic>=0.39.0",
    "google-generativeai>=0.8.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "pillow>=10.0.0"]
cloud = ["azure-ai-formrecognizer>=3.3.0", "boto3>=1.34.0"]
langchain = ["langchain>=0.3.0", "langchain-community>=0.3.0"]
spacy = ["spacy>=3.7.0"]
local = ["ollama>=0.1.0"]
storage = ["psycopg2-binary>=2.9.9"]
datasets = ["datasets>=2.0.0", "requests>=2.31.0", "platformdirs>=3.0.0"]
retrieval = ["pgvector>=0.3.0", "sentence-transformers>=2.0.0", "ollama>=0.1.0"]
chroma = ["chromadb>=0.4.0"]
network = ["requests>=2.31.0"]
eval = ["pyyaml>=6.0.0"]
privacy = ["presidio-analyzer>=2.2.0", "presidio-anonymizer>=2.2.0", "cryptography>=41.0.0"]
rag = ["sentence-transformers>=2.0.0"]
graph = ["networkx>=3.0.0", "neo4j>=5.0.0"]
stream = []
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "black==24.10.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
    "psycopg2-binary>=2.9.9",
    "scikit-learn>=1.3.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]
all = ["contractex[ocr,cloud,langchain,spacy,local,storage,datasets,retrieval,chroma,privacy,rag,graph]"]

[project.urls]
Homepage = "https://github.com/aahepburn/Contract-Clause-Extractor"
Documentation = "https://github.com/aahepburn/Contract-Clause-Extractor/blob/main/README.md"
Repository = "https://github.com/aahepburn/Contract-Clause-Extractor"
Issues = "https://github.com/aahepburn/Contract-Clause-Extractor/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["contractex*"]
exclude = ["tests*", "examples*", "benchmarks*", "docs*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E402"]  # Allow imports not at top for demonstration purposes

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--cov=contractex --cov-report=html --cov-report=term-missing -v"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["contractex"]
omit = [
    "tests/*",
    "examples/*",
    "benchmarks/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
