[pytest]
# Pytest configuration for Contract Clause Extractor

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Don't recurse into these directories for test collection
norecursedirs = dbase .venv venv env htmlcov .git __pycache__ .pytest_cache

# Minimum Python version
minversion = 6.0

# Command line options
addopts =
    # Verbose output
    -v
    # Show summary of all test results
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers - fail if unknown marker used
    --strict-markers
    # Strict config - fail on config issues
    --strict-config

# Markers for categorizing tests
markers =
    unit: Unit tests that don't require external dependencies
    integration: Integration tests that require LLM API calls
    slow: Tests that are slow to run
    smoke: Quick smoke tests for CI
    llm: Tests that call LLM APIs (may incur costs)

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options (when using pytest-cov)
# Run with: pytest --cov=contractex --cov-report=html
[coverage:run]
source = contractex
omit = 
    */tests/*
    */conftest.py
    */__pycache__/*
    */examples/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

# Ignore warnings
filterwarnings =
    # Ignore deprecation warnings from dependencies
    ignore::DeprecationWarning
    # Treat other warnings as errors
    error::UserWarning
