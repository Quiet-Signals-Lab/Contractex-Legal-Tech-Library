site_name: Contractex
site_description: Open processing layer for legal document AI, with privacy enforced in code and quality measured.
site_url: https://quietsignalslab.com/contractex/docs/
repo_url: https://github.com/Quiet-Signals-Lab/Contractex-Legal-Tech-Library
repo_name: Quiet-Signals-Lab/Contractex-Legal-Tech-Library
edit_uri: edit/main/docs/
copyright: Apache License 2.0 · Quiet Signals Lab

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - minify:
      minify_html: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: false
            show_signature_annotations: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quickstart.md
  - Guides:
      - Privacy model: guides/privacy.md
      - Tasks and pipelines: guides/tasks.md
      - Contract analysis: guides/analysis.md
      - Chunking and provenance: guides/chunking.md
      - Evaluation: guides/evaluation.md
      - LLM providers: guides/providers.md
  - Benchmarks: benchmarks.md
  - Limitations: limitations.md
  - Reference:
      - Privacy: api/privacy.md
      - Tasks: api/tasks.md
      - Documents: api/documents.md
      - ContractExtractor: api/extractor.md
      - Extraction schemas: api/schemas.md
      - Document structure: api/structure.md
      - Analysis: api/analysis.md
      - Chunking and provenance: api/chunking.md
      - Evaluation: api/eval.md
      - LLM providers: api/llm.md
  - Project:
      - Changelog: project/changelog.md
      - Contributing: project/contributing.md
      - Security: project/security.md
