site_name: ContractEx
hooks:
  - docs/hooks.py
site_description: Deterministic structural parsing + schema-constrained LLM extraction for contract analysis.
site_url: https://contractex.readthedocs.io
repo_url: https://github.com/Quiet-Signals-Lab/Contractex-Legal-Tech-Library
repo_name: Quiet-Signals-Lab/Contractex-Legal-Tech-Library
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - minify:
      minify_html: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            show_root_heading: true
            show_root_full_path: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - How-To Guides:
      - Run extraction locally with Ollama: guides/local-llm.md
      - Write a custom playbook: guides/playbooks.md
      - Benchmark against CUAD: guides/benchmarking.md
      - Export results: guides/export.md
  - API Reference:
      - ContractExtractor: api/extractor.md
      - Document Structure: api/structure.md
      - Extraction Schemas: api/schemas.md
      - Analysis: api/analysis.md
      - Evaluation: api/eval.md
  - Explanation:
      - Architecture: explanation/architecture.md
      - Design Decisions: explanation/design.md
      - Why Local-First: explanation/privacy.md
