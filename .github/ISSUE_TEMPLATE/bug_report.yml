name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Do not paste real client documents or personal data. Reduce the problem
        to synthetic text. Security problems (for example, document text reaching
        a model against its privacy profile) go to hello@quietsignalslab.com,
        not here.
  - type: input
    id: version
    attributes:
      label: Contractex version
      description: python -c "import contractex; print(contractex.__version__)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version, OS and extras installed
      placeholder: 3.12, macOS 15, contractex[ollama,privacy]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest code and synthetic input that shows the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
      description: Include the full traceback if there is one.
    validations:
      required: true
