name: Proposal
description: Suggest a change. Please open this before writing code for anything non-trivial.
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Include how it would be tested, and any effect on privacy behaviour.
    validations:
      required: true
