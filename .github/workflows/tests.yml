name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new release of a dependency that breaks the library is
  # noticed without waiting for the next commit.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      # provider extras so mypy checks provider code against the real SDK types
      - run: pip install -e ".[dev,openai,anthropic,google,ollama]"
      - run: ruff check contractex tests benchmarks
      - run: black --check contractex tests benchmarks
      - run: mypy contractex

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # committed results must match a fresh run of the deterministic suites
      - run: python -m benchmarks --check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # the coverage floor is [tool.coverage.report] fail_under in pyproject.toml
      - run: pytest --cov=contractex --cov-report=xml --cov-report=term-missing
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # The oldest versions the package metadata allows, on the oldest Python.
  minimum-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pip install "pydantic==2.9.0" "pypdfium2==4.30.0" "python-docx==1.1.0" "pyyaml==6.0.0"
      - run: pytest

  # The storage layer against a real PostgreSQL with pgvector.
  storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,storage]"
      - run: pytest -m integration

  # Detection with the real Presidio engine (the small spaCy model is enough
  # for what these tests check).
  presidio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,privacy]"
      - run: python -m spacy download en_core_web_sm
      - run: pytest tests/test_privacy_presidio.py -rs

  # What users install: the built wheel, in a clean environment, outside the
  # source tree.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - run: python -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
      - name: Import the installed wheel and check its data files
        working-directory: ${{ runner.temp }}
        run: |
          venv/bin/python - <<'EOF'
          from importlib import resources

          import contractex

          root = resources.files("contractex")
          for name in ("py.typed", "storage/schema.sql", "playbooks/schema.yaml"):
              assert root.joinpath(name).is_file(), name
          assert "site-packages" in contractex.__file__, contractex.__file__
          print("contractex", contractex.__version__, "imports from the wheel")
          EOF
